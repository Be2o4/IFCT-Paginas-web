<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contenedor {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            flex-grow: 1;
        }

        .contenedor div {
            width: 200px;
            height: 200px;
            font-size: 3rem;
            border: 1px solid blueviolet;

        }

        .numero {
            display: flex;
            align-items: center;
            justify-content: center;

        }
        .doble{
            flex-grow: 2;
        }
    </style>
</head>

<body>
    <div class="contenedor">
        <div>
            <p class="numero doble">1</p>
        </div>
        <div>
            <p class="numero">2</p>
        </div>
        <div>
            <p class="numero">3</p>
        </div>
        <div>
            <p class="numero">4</p>
        </div>
        <div>
            <p class="numero">5</p>
        </div>
        <div>
            <p class="numero">6</p>
        </div>


    </div>

</body>

</html>
