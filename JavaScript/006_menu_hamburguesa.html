<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Hamburguesa</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body{
            line-height: 1.6;
            background-color: beige;
            color: black;
        }
        header{
            background-color: cornflowerblue;
            color: white;
            position: relative;

        }
        nav{
            max-width: 1000px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            
        }
        .logo{
            font-size: 30px;
            font-weight: bold;
        }
        #menu{
            list-style:none;
            display: flex;
            gap: 25px;
        }
        #menu a{
            text-decoration: none;
            margin-left: 25px;

        }
        #menu a:hover{
            color: black;
        }
        #hamburguesa{
            display: none;
            font-size: 28px;
            background: none;
            border: none;
            color: blanchedalmond;
            cursor: pointer;
        }
        @media (max-width:700px){
            #hamburguesa{
                display: block;
            }
            #menu{
                display: none;
                position: absolute;
                top:100%;
                left: 0;

                width: 100%;
                background-color: lightblue;
                flex-direction: column;
                box-shadow: 0 5px 10px black;
            }
            #menu li{
                margin: 0;
                border-top: 1px solid black;
                
            }
            #menu a{
                display: block;
                padding: 15px;
            }
        }

    </style>
</head>
<body>
    <header>
        <nav>
            <div class="logo">Mi Logo</div>
            <button id="hamburguesa"> &#9776; </button>
            <ul id="menu">
                <li><a href=""></a>Archivos</li>
                <li><a href=""></a>Editar</li>
                <li><a href=""></a>Selección</li>
                <li><a href=""></a>Ver</li>
                <li><a href=""></a>Ayuda</li>
            </ul>
        </nav>
    </header>
    <script>
        const boton = document.getElementById("hamburguesa");
        const menu = document.getElementById("menu");

        boton.addEventListener("click", cambia_menu);
        window.addEventListener("resize",restaura_menu)
        function cambia_menu(){
            if (menu.style.display == "flex"){
                menu.style.display = "none";
            }
            else{
                menu.style.display= "flex";
                menu.style.flexDirection = "Column";
            }
        }
        function restaura_menu(){
            if(window.innerWidth > 700){
                menu.style.display = "flex";
                menu.style.flexDirection = "row";
            }
            else{
                menu.style.display="none";

            }
        }
        restaura_menu();
    </script>
</body>
</html>
