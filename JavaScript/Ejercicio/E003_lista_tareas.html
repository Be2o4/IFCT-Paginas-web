<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de tareas</title>

    <style>
        * {
            padding: 0;
            margin: 0 auto;

        }

        body {

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, Courier, monospace;
            display: flex;
            justify-content: center;
            background-color: khaki;
            padding-top: 20vh;
        }

        h1 {
            text-decoration: underline;
            padding-top: 3rem;
            text-align: center;
            padding-left: 1rem;

        }

        ul {
            margin-top: 1rem;


        }

        li {
            display: grid;
            grid-template-columns: 1rem 1fr auto;
            gap: 10 px;
            list-style: none;
            line-height: 2.4;
            align-items: center;
           
            background-color: rgba(255, 255, 255, 0.056);
            border-radius: 20px;
            border-left: 2px solid rgba(201, 201, 201, 0.24);
            border-bottom:2px solid rgba(201, 201, 201, 0.41);
            margin-bottom: 10px;
        }

        li button {
            padding: 3px;
           
            height: fit-content;
            color: rgb(255, 251, 179);
            background-color: rgb(13, 13, 13);
            border-radius: 20px;
           
            
        }

        li.tachado span {
            text-decoration: line-through;
            color: brown;
        }

        .app {

            min-height: 40vh;
            min-width: 40vw;
            border: 2px solid rgb(214, 205, 44);
            border-radius: 20px;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.915);
            color: rgb(255, 251, 179);
            text-shadow: 20px solid red;
        }

        .editor {
            padding-top: 3rem;
            display: flex;
            gap: 5px;
            padding: 20px;
            border-bottom: 1px solid rgb(0, 0, 0);
            border-radius: 10px;
            

        }

        .editor input, li input {
            color: rgb(0, 0, 0);
            padding-left: 10px;
            font-size: 1.1rem;
            display: flex;
            flex-grow: 3;
            background-color: rgb(255, 251, 179);
            border-radius: 10px;
        }

        .editor button {
            background-color: rgba(175, 175, 42, 0);
            
            font-size: 1rem;
            flex-grow: 3;
           color: rgb(255, 251, 179);
            border-radius: 10px;

        }

        .mycheck2 {
            border-radius: 10px;

            margin: 10px;
            cursor: pointer;
            background-color: rgb(255, 251, 179);
            color: rgb(255, 251, 179);
            background-image: url("data:image/svg+xml,%3csvg viewBox='0 0 16 16' fill='white' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z'/%3e%3c/svg%3e");
            width: 24px;
            height: 24px;
            appearance: none;
            border: 2px solid #888;
            background-position: 0 -2rem;
            background-size: 100%;
            background-repeat: no-repeat;
            transition: all 0.3s ease-in-out;
        }

        .mycheck2:checked {

            background-color: rgb(255, 5, 5);
           
            background-position: 0 0;
        }
        .botonera button{ 
            background-color: rgba(255, 255, 255, 0.056);

        }
    </style>

</head>

<body>
    <div class="app">
        <h1>Mi lista de tareas</h1>
        <div class="editor">
            <input type="text" name="" id="nueva_tarea" placeholder="Nueva tarea">
            <button onclick="crear_tarea()">Crear</button>
        </div>
        <div class="botonera">
            <button onclick="guardar_lista()">Guardar</button>
            <button onclick="cargar_lista()">Cargar</button>
        </div>
        <ul id="tareas"></ul>
    </div>

    <script>
        let array_tareas = []
        function crear_tarea() {
            const input = document.getElementById("nueva_tarea");
            const texto = input.value;

            const li = document.createElement('li');
            const check = document.createElement('input');
            check.type = "checkbox";
            check.className = "mycheck2";
            check.onclick = function () { alternar(this); }

            const span = document.createElement('span');
            span.innerHTML = texto;
            span.onclick = function () { editar_tarea(this); }

            const boton = document.createElement('button');
            boton.innerHTML = "Borrar";
            boton.onclick = function () { borrar_tarea(this); }

            li.appendChild(check);
            li.appendChild(span);
            li.appendChild(boton);

            const lista = document.getElementById("tareas");
            lista.appendChild(li);

            input.value = "";

        }
        function borrar_tarea(boton) {
            const li = boton.parentNode;
            li.parentNode.removeChild(li);

        }
        function alternar(casilla) {
            const li = casilla.parentNode;
            if (casilla.checked) {
                li.className = "tachado";
            }
            else {
                li.className = "";
            }
        }

        function editar_tarea(span) {
            const texto_actual = span.innerHTML;
            const input = document.createElement('input');
            input.type = "text";
            input.value = texto_actual;

            input.onblur = function () {
                if (input.value === '') {
                    span.innerHTML = texto_actual;
                }
                else {
                    span.innerHTML = input.value;
                }
                input.parentNode.replaceChild(span, input);

            };
            span.parentNode.replaceChild(input, span);
            input.focus();

        }
        function guardar_lista(){
            const tareas = document.getElementById("tareas");
            let elementos = tareas.getElementsByTagName('span');
            let lista =[];

            for(let i= 0; i < elementos.length; i++){
                lista.push(elementos[i].innerHTML);
            }
            localStorage.setItem('mis_tareas',JSON.stringify(lista));
            
        }
        function cargar_lista(){
            let datos = localStorage.getItem('mis_tareas');
            

        }    </script>
</body>

</html>
