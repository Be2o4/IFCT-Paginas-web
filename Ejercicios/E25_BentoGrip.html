<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medidas</title>
    <style>
        .contenedor{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: repeat(4,1fr);
            grid-template-columns: minmax();
            background-color: rgb(0, 0, 0);
            gap: 20px;
            padding: 1rem;
            margin: 0 auto;
            max-width: 890px;
            max-height: 900px;
             border-radius: 10px;          
            
        }
        .contenedor div{
          
            border: 1px solid black;
            background-color: yellow;
            border-radius: 5px;
            background-size:cover ;
            background-position: center;
            border-radius: 10px; 
            min-height: 210px;
           
            
        }
        .contenedor .elem1{
            background-image: url();
            grid-column: 1/3;
          
        }
        .contenedor .elem2{
            background-image: url();
            
        }
        .contenedor .elem3{
            background-image: url();
        
           
        }
        .contenedor .elem4{
            background-image: url();
           
        }
        .contenedor .elem5{
            background-image: url();
           grid-area:2/3/4/4;
        }
        .contenedor .elem6{
            background-image: url();
        }
        .contenedor .elem7{
            background-image: url();
            
        }
      

    </style>
</head>
    <div class="contenedor">
        <div class="elem1"></div>
       <div class="elem2"></div>
       <div class="elem3"></div>
       <div class="elem4"></div>
       <div class="elem5"></div>
       <div class="elem6"></div>
       <div class="elem7"></div>
       
    </div>
